<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="agentpane, turn finished">
	<!--
	  The badged sibling of public/favicon.svg (OW-diyuwu), shown while a turn
	  this tab submitted has finished unnoticed. Everything outside the two
	  circles below is a copy of that file; change one and change the other.

	  Two files rather than one icon patched at runtime: swapping the href on
	  the link between two served files is the well supported path, where a
	  data URI or a canvas rendered PNG built in the page is not.

	  The cutout circle is the tile colour and is centred on (12.5, 3.5) with
	  r=3.5, which is exactly the arc of the tile's own rounded corner, so it
	  cannot spill outside the tile. It erases the corner of the top right
	  pane, which is what gives the dot its gap. Both circles are drawn before
	  the A so the letter, the one high contrast element, stays on top.

	  #57c98a is the dark theme ap-success token from src/client/app.css
	  (spelled without its leading hyphens, see the last paragraph). An SVG
	  file cannot read a CSS custom property from the page, so the colour is
	  copied here the way the tile colour already is. The light theme
	  #157f4b does not read on this blue.

	  No em dashes in here. XML forbids a double hyphen inside a comment, and
	  a favicon that fails to parse renders as nothing at all, silently.
	-->
	<rect width="16" height="16" rx="3.5" fill="#3959d9" />
	<g fill="#6b82e3">
		<rect x="2" y="2" width="5" height="5" rx="1" />
		<rect x="9" y="2" width="5" height="5" rx="1" />
		<rect x="2" y="9" width="5" height="5" rx="1" />
		<rect x="9" y="9" width="5" height="5" rx="1" />
	</g>
	<circle cx="12.5" cy="3.5" r="3.5" fill="#3959d9" />
	<circle cx="12.5" cy="3.5" r="2.7" fill="#57c98a" />
	<path d="M3.3 13.1 8 3.1 12.7 13.1 M4.6 10.4 H11.4"
		fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
</svg>
